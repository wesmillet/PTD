<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sinnoh Tower Defense</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; padding: 0; background: #1b1b24; height: 100%; overflow: hidden; }
      #game { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
      canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
      /* Fixed zoom (Options > Zoom): let a canvas bigger than the window scroll instead of clipping. */
      html.ptd-zoomed, html.ptd-zoomed body { overflow: auto; }
      html.ptd-zoomed #game { justify-content: safe center; align-items: safe center; min-height: 100%; height: auto; width: max-content; min-width: 100%; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
